<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Form</title>
</head>
<body>
  <h1>Sign up</h1>
  <form action="thanks.html" method="get">
    <p>
      <label>
        Name
        <input name="name" aria-label="Name" autocomplete="off">
      </label>
    </p>
    <p>
      <label>
        Email
        <input name="email" type="email" aria-label="Email" autocomplete="off">
      </label>
    </p>
    <p>
      <button type="submit" aria-label="Submit">Submit</button>
    </p>
  </form>
</body>
</html>
