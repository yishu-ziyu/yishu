name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify unified Yishu product spine
        run: pnpm product:verify

      - name: Verify AgentCore laboratory
        run: |
          pnpm --filter @yishu/agent-core check
          pnpm --filter @yishu/agent-core test
